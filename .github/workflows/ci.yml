name: CI

# Pull requests run through pull_request, so pushes only need to cover main: a push
# trigger for every branch would run the macOS matrix twice for each pull request.
# Any other branch can be run by hand (gh workflow run CI --ref <branch>).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run still going for the same branch or pull request: the
# macOS runners are often busy, and the newest run's table is the one that matters
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.mode }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both are Apple Silicon runners
        os: [macos-15, macos-26]
        mode: [nolibs, libsystem, static, static-x86_64, static-dyld]
        # Known failures stay in the matrix, so every run records what works where
        # (see "Where it works" in README.md). Such a job passes only if the build or
        # tests fail with this message; if the mode starts working, or fails some
        # other way, the job fails so the README can be updated.
        include:
          - mode: nolibs
            expected-error: "ld: dynamic executables or dylibs must link with libSystem.dylib"
          # Release kernels kill static arm64 executables, so this mode passes by
          # building and passing static_layout, without running
          - mode: static
            success-result: "builds (only `static_layout` runs)"
    runs-on: ${{ matrix.os }}
    # A job takes under a minute; this stops a hang from holding a scarce macOS runner
    # for the default 6 hours
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: command -v ninja || brew install ninja

      - name: Install Rosetta
        if: matrix.mode == 'static-x86_64'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          ld -v 2>&1 | head -1
          cmake --version | head -1

      - name: Configure, build and test
        env:
          MODE: ${{ matrix.mode }}
          RUNNER: ${{ matrix.os }}
          EXPECTED_ERROR: ${{ matrix.expected-error }}
          SUCCESS_RESULT: ${{ matrix.success-result || 'works' }}
        run: |
          set +e
          cmake --workflow --preset "$MODE" 2>&1 | tee workflow.log
          status=${PIPESTATUS[0]}
          set -e
          if [ -z "$EXPECTED_ERROR" ]; then
            if [ "$status" -eq 0 ]; then result="$SUCCESS_RESULT"; else result="**fails** (unexpected)"; fi
          elif [ "$status" -ne 0 ] && grep -qF -- "$EXPECTED_ERROR" workflow.log; then
            result="fails as expected: \`$EXPECTED_ERROR\`"
            status=0
          elif [ "$status" -eq 0 ]; then
            result="**works**, but was expected to fail with \`$EXPECTED_ERROR\`"
            status=1
          else
            result="**fails** differently from the expected \`$EXPECTED_ERROR\`"
            status=1
          fi
          xcode=$(xcodebuild -version | head -1)
          echo "| \`$MODE\` | $RUNNER | macOS $(sw_vers -productVersion) | $xcode | $result |" > "result-$MODE-$RUNNER.md"
          cat "result-$MODE-$RUNNER.md"
          exit "$status"

      # Not on a cancelled run: a newer push superseded it, and its results are partial
      - name: Upload result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.mode }}-${{ matrix.os }}
          path: result-*.md

  report:
    name: What works where
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          merge-multiple: true

      - name: Summarize
        run: |
          {
            echo "| Mode | Runner | OS | Xcode | Result |"
            echo "|---|---|---|---|---|"
            cat result-*.md | sort
          } | tee -a "$GITHUB_STEP_SUMMARY"
